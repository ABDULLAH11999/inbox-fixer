services:
  - type: web
    name: inboxfixer
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_APP_URL
        value: https://inboxfixer.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: inboxfixer-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: inboxfixer-db
    plan: free
